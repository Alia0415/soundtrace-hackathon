<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>声迹 · 我的</title>
<style>
  :root { --bg:#0f1420; --card:#171e2e; --line:#26304a; --acc:#5b8cff; --dim:#8a94ad; --amber:#f5a623; }
  * { box-sizing:border-box; }
  body { font-family:"Microsoft YaHei",sans-serif; background:var(--bg); color:#e8ecf5; margin:0; padding:0 0 70px; }
  .wrap { max-width:560px; margin:0 auto; padding:24px 16px; }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px; max-width:560px; margin:0 auto; }
  header h1 { font-size:18px; margin:0; flex:1; } a.back { color:var(--dim); text-decoration:none; font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px; text-align:center; }
  .bigava { width:76px; height:76px; border-radius:50%; background:#0d1220; border:2px solid var(--acc); display:flex; align-items:center; justify-content:center; font-size:38px; margin:0 auto 10px; }
  .card h2 { margin:0 0 4px; font-size:18px; }
  .stat { display:flex; gap:10px; justify-content:center; margin-top:12px; }
  .stat div { background:#0d1220; border:1px solid var(--line); border-radius:10px; padding:10px 18px; font-size:13px; }
  .stat b { display:block; font-size:18px; }
  input { background:#0d1220; border:1px solid var(--line); color:#e8ecf5; border-radius:8px; padding:9px 12px; font-size:14px; width:70%; }
  button { background:var(--acc); border:none; color:#fff; padding:9px 16px; border-radius:8px; cursor:pointer; font-size:13px; margin-top:8px; }
  button.ghost { background:none; border:1px solid var(--line); color:#cfd7ea; }
  .sent { text-align:left; font-size:13px; }
  .sent .it { padding:8px 0; border-bottom:1px dashed var(--line); }
  .tag { font-size:11px; padding:2px 8px; border-radius:10px; background:#26304a; margin-left:6px; }
  .avas { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
  .avas span { font-size:24px; cursor:pointer; padding:6px; border-radius:10px; border:1px solid transparent; }
  .avas span.on { border-color:var(--acc); background:rgba(91,140,255,.15); }
  nav.bottom { position:fixed; bottom:0; left:0; right:0; background:#0d1220f2; border-top:1px solid var(--line); display:flex; }
  nav.bottom a { flex:1; text-align:center; padding:10px 0 12px; color:var(--dim); text-decoration:none; font-size:12px; }
  nav.bottom a.on { color:var(--acc); } nav.bottom .i { font-size:20px; display:block; }
</style>
<link rel="stylesheet" href="/assets/soundtrace-shell.css">
<link rel="stylesheet" href="/assets/soundtrace-sections.css">
<link rel="stylesheet" href="/assets/soundtrace-frameless.css">
<script src="/assets/soundtrace-shell.js" defer></script>
<link rel="stylesheet" href="/assets/soundtrace-calm.css">
<link rel="stylesheet" href="/assets/soundtrace-daylight.css">
</head>
<body class="st-me">
<header class="st-pagehead"><div><h1>我的记忆</h1><p>收藏一路走来的回声，也留下给别人的声音。</p></div><a href="/album">进入收藏间 ↗</a></header>
<main class="st-profile-layout">
  <div class="st-profile-main"><div class="card st-profile-card"><span class="st-section-title">声音档案</span>
    <div class="bigava" id="ava">🎧</div>
    <h2 id="name">…</h2>
    <div class="st-profile-login" id="loginState">未登录</div>
    <details class="profile-edit"><summary>编辑个人资料</summary><div class="row st-profile-name-edit">
      <label for="nameIn" class="sr-only">修改昵称</label><input id="nameIn" placeholder="修改昵称"><button onclick="saveName()">保存昵称</button>
    </div>
    <div class="avas" id="avaPick"></div></details><p id="profileFeedback" class="profile-feedback" role="status"></p>
    <div class="stat">
      <div><b id="stStreak">0</b>连续签到</div><div><b id="stSent">0</b>寄出信件</div><div><b id="stWorks">0</b>作品</div>
    </div>
  </div>
  <button id="checkinBtn" type="button" onclick="checkin()">今日签到</button><div class="card sent"><span class="st-section-title">寄出的声音</span><h3>从这里，去往另一端。</h3><div id="sents">…</div></div></div>
  <aside class="st-profile-side"><a class="st-profile-feature" href="/album?listen=1"><div><h2>再听一次</h2><span>试听声音藏品 ↗</span></div></a><div class="st-panel st-profile-latest"><span class="st-section-title">最近做成的唱片</span><div id="latestWorks">正在载入…</div><a href="/studio#rec">继续制作 ↗</a></div></aside>
</main>
<nav class="bottom">
  <a href="/studio#rec"><span class="i">🎙</span>记录</a>
  <a href="/album"><span class="i">💿</span>收藏间</a>
  <a href="/community"><span class="i">🌐</span>社区</a>
  <a href="/me" class="on"><span class="i">👤</span>我的</a>
</nav>
<script>
const api = async (u, o) => { const response=await fetch(u,o); if(!response.ok) throw new Error('暂时无法保存，请稍后重试'); return response.json(); };
const AVAS = ['🎧','🏔','🌊','🐦','🍁','🚂','🎸','🌙'];
async function load() {
  const u = await api('/api/user');
  document.getElementById('ava').textContent = u.avatar;
  document.getElementById('name').textContent = u.name;
  document.getElementById('nameIn').value = u.name;
  document.getElementById('loginState').textContent = u.logged_in ? '已登录' : '编辑资料，开启你的声音档案';
  document.getElementById('stStreak').textContent = u.streak || 0;
  document.getElementById('avaPick').innerHTML = AVAS.map(a =>
    `<button type="button" aria-label="选择头像 ${a}" aria-pressed="${a===u.avatar}" onclick="setAva('${a}')">${a}</button>`).join('');
  const [ex, w] = await Promise.all([api('/api/exchange'), api('/api/works')]);
  const sent = (ex.items || []).filter(x => x.dir === 'out');
  document.getElementById('stSent').textContent = sent.length;
  document.getElementById('stWorks').textContent = (w.works || []).length;
  const latest = document.getElementById('latestWorks'); latest.replaceChildren();
  (w.works || []).slice(-3).reverse().forEach(work => { const row = document.createElement('div'); row.className = 'st-profile-work'; const title = document.createElement('strong'); title.textContent = work.title || '未命名唱片'; const place = document.createElement('small'); place.textContent = work.metadata?.location || '声音记忆'; row.append(title, place); latest.append(row); });
  if (!latest.childElementCount) latest.textContent = '还没有作品。';
  const kindName = { photo:'🖼照片', vinyl:'💿唱片', tape:'📼磁带' };
  document.getElementById('sents').innerHTML = sent.map(s => `
    <div class="it">${kindName[s.kind]||s.kind}「${s.title}」 → 寄给${s.to}
      ${s.allow_reuse ? '<span class="tag">已授权二创</span>' : '<span class="tag">禁止二创</span>'}</div>`).join('')
    || '<div style="color:var(--dim)">还没有寄出过信件——去唱片册拖一张进信箱吧</div>';
}
async function setAva(a) { try { await api('/api/user',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({avatar:a})}); await load(); } catch(e) { document.getElementById('profileFeedback').textContent=e.message; } }
async function saveName() { const v=document.getElementById('nameIn').value.trim(); if(!v)return;
  try { await api('/api/user',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:v,logged_in:true})}); await load(); document.getElementById('profileFeedback').textContent='已保存'; document.querySelector('.profile-edit').open=false; } catch(e) { document.getElementById('profileFeedback').textContent=e.message; } }
async function checkin() { const b=document.getElementById('checkinBtn'); b.disabled=true; try { const result=await api('/api/user/checkin',{method:'POST'}); document.getElementById('profileFeedback').textContent=result.msg || '已签到'; await load(); } catch(e) { document.getElementById('profileFeedback').textContent=e.message; } finally { b.disabled=false; } }
load().catch(()=>document.getElementById('profileFeedback').textContent='暂时无法读取资料，请稍后重试。');
</script>
</body>
</html>
