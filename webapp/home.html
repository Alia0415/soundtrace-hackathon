<!doctype html>
<html lang="zh-CN">
<head>
<script src="/assets/soundtrace-raster.js?v=8" defer></script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>声迹 · 把此刻留在声音里</title>
  <script src="/assets/soundtrace-shell.js?v=5" defer></script>
<link rel="stylesheet" href="/assets/soundtrace-doodle.css?v=1">
<link rel="stylesheet" href="/assets/soundtrace-raster.css?v=7">
<link rel="stylesheet" href="/assets/soundtrace-selected-ui.css?v=4">
</head>
<body class="st-home st-home-calm">
  <header class="home-header">
    <a class="home-brand" href="/" aria-label="声迹首页">声迹<span>SoundTrace</span></a>
  </header>
  <main>
    <section class="home-scene" aria-labelledby="homeTitle" id="homeScene">
      <div class="home-landscape" aria-hidden="true"><span class="home-art-desktop" data-raster="home-desktop"></span><span class="home-art-mobile" data-raster="home-mobile"></span></div>
      <div class="home-story">
        <h1 id="homeTitle">此刻，<br>听见生活。</h1>
        <a class="home-record original-art-button" href="/capture" aria-label="录一段声音"><span class="home-button-desktop" data-raster="home-record-desktop"></span><span class="home-button-mobile" data-raster="home-record-mobile"></span><span class="sr-only">录一段声音</span></a>
      </div>
      <a class="home-listen" href="/album?scene=sea-window&amp;listen=1&amp;demo=1" aria-label="试听海港午后的示例声音">
        <span class="home-play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7z"/></svg></span>
        <span><strong>海港午后</strong><small>听一段示例声音</small></span>
      </a>
      <a class="home-explore original-art-button" href="/map" aria-label="声音地图"><span class="home-button-desktop" data-raster="home-map-desktop"></span><span class="home-button-mobile" data-raster="home-map-mobile"></span><span class="sr-only">声音地图</span></a>
    </section>
  </main>
  <script>
    // 手机版：此刻页双指捏合（缩放）即可进入声音地图
    (() => {
      const scene = document.getElementById('homeScene');
      if (!scene) return;
      let base = 0, active = false;
      scene.addEventListener('touchstart', e => {
        if (e.touches.length === 2) {
          const [a, b] = e.touches;
          base = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
          active = true;
        }
      }, { passive: true });
      scene.addEventListener('touchmove', e => {
        if (!active || e.touches.length !== 2) return;
        const [a, b] = e.touches;
        const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        if (base && Math.abs(dist - base) / base > 0.25) {
          active = false;
          location.href = window.SoundTraceRoute?.('/map') || '/map';
        }
      }, { passive: true });
      scene.addEventListener('touchend', () => { active = false; }, { passive: true });
    })();
  </script>
</body>
</html>
