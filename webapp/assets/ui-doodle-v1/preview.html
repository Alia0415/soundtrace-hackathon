<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>声迹 · 全站线描 UI 设计图</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#000;background:#fff}*{box-sizing:border-box}body{margin:0}main{max-width:1440px;margin:auto;padding:40px 28px}h1{font-family:"Noto Serif SC","SimSun",serif;font-size:36px;margin:0 0 16px}h1 span{border-bottom:4px solid #00a8f0}p{color:#626262;font-size:14px;line-height:1.8}.actions,.filters{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button,a{font:inherit}a{color:#007aa6}button,.primary{cursor:pointer;background:#fff;color:#000;border:1.5px solid #000;border-radius:24px;padding:9px 17px;text-decoration:none}.primary{background:#00a8f0;border-color:#00a8f0}.filters button{border-color:transparent;border-radius:0;padding:8px 0;margin-right:14px}.filters button[aria-pressed=true]{border-bottom:3px solid #00a8f0;color:#007aa6}.status{font-size:13px}#gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 28px;margin:28px 0}.item{min-width:0}.figure{height:360px;display:flex;align-items:center;justify-content:center;background:#fff;border-bottom:1px solid #e8e8e8;padding:8px}.figure img{max-width:100%;max-height:100%;object-fit:contain}.figure button{display:contents}.figure button:focus-visible img{outline:3px solid #00a8f0;outline-offset:4px}h2{font-size:16px;margin:14px 0 7px}.meta{font-size:12px;color:#666}.downloads{display:flex;gap:14px;font-size:13px;margin:12px 0}details{font-size:12px;line-height:1.8;color:#666}summary{cursor:pointer;color:#333}dialog{width:95vw;max-width:1600px;height:94vh;max-height:94vh;border:1.5px solid #000;border-radius:12px;padding:18px}dialog::backdrop{background:rgba(0,0,0,.65)}.viewer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.viewer-head h2{margin:0}.viewer-tools{display:flex;gap:10px;align-items:center}.viewer-body{height:calc(100% - 55px);overflow:auto;text-align:center}.viewer-body img{max-width:100%;max-height:100%;object-fit:contain}.viewer-body img.full{max-height:none;max-width:none;width:auto}.pending{font-size:13px;color:#777}@media(max-width:850px){#gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.figure{height:300px}}@media(max-width:520px){main{padding:26px 16px}h1{font-size:27px}#gallery{grid-template-columns:1fr;gap:28px}.figure{height:470px}.actions{gap:10px}.viewer-head{align-items:flex-start}.viewer-tools{gap:6px}.viewer-tools button{padding:6px 9px;font-size:12px}}
</style></head><body><main><header><h1>声迹 · <span>全站线描 UI</span></h1><p>纯白、黑色手绘线条、天蓝主操作。33 张独立设计图，覆盖主页面、手机与桌面布局、关键弹窗及条件状态。点击设计图可放大。</p><p>本页用于视觉评审；功能按键以完整清单为准。正式网页尚未替换为这些设计。</p><div class="actions"><a class="primary" href="soundtrace-doodle-ui-designs.zip" download>下载全部设计图</a><a href="UI_DOODLE_DESIGN_SYSTEM.md" download>视觉规范</a><a href="UI_REDESIGN_BRIEF.md" download>完整按键清单</a><a href="prompts.json" download>提示词</a><button id="refresh">刷新</button></div><p class="status" id="status" role="status">正在读取…</p><nav class="filters" id="filters" aria-label="按模块筛选"></nav></header><section id="gallery" aria-label="设计图"></section></main><dialog id="viewer"><div class="viewer-head"><h2 id="viewer-title"></h2><div class="viewer-tools"><button id="zoom">原尺寸</button><a id="original" download>PNG</a><button id="close">关闭 ×</button></div></div><div class="viewer-body"><img id="large" alt=""></div></dialog>
<script>
let data={assets:[]},category='全部';const categories=['全部','此刻','录音与保存','音乐制作','收藏与个人','声音地图','社区','账号与状态'];const filters=document.getElementById('filters');
for(const name of categories){const button=document.createElement('button');button.textContent=name;button.setAttribute('aria-pressed',name===category);button.onclick=()=>{category=name;for(const b of filters.children)b.setAttribute('aria-pressed',b===button);render()};filters.append(button)}
async function load(){try{const response=await fetch('manifest.json',{cache:'no-store'});if(!response.ok)throw Error('无法读取清单');data=await response.json();document.getElementById('status').textContent='已完成 '+data.count+' / '+data.expected+' · 已修订 '+data.assets.filter(a=>a.revised).length+' 张';render()}catch(e){document.getElementById('status').textContent='正在导出设计图，请稍后刷新。'}}
function render(){const gallery=document.getElementById('gallery');gallery.replaceChildren();for(const a of data.assets.filter(a=>category==='全部'||a.category===category)){const item=document.createElement('article');item.className='item';const figure=document.createElement('div');figure.className='figure';const button=document.createElement('button');button.setAttribute('aria-label','放大 '+a.title);const img=document.createElement('img');img.src=a.webp;img.alt=a.title;img.loading='lazy';button.append(img);button.onclick=()=>open(a);figure.append(button);const heading=document.createElement('h2');heading.textContent=a.title;const meta=document.createElement('div');meta.className='meta';meta.textContent=a.id+' · '+a.width+'×'+a.height+(a.revised?' · 修订版':'');const downloads=document.createElement('div');downloads.className='downloads';for(const [file,label] of [[a.png,'高清 PNG'],[a.webp,'WebP']]){const link=document.createElement('a');link.href=file;link.download='';link.textContent=label;downloads.append(link)}const detail=document.createElement('details');const summary=document.createElement('summary');summary.textContent='功能核对';const text=document.createElement('p');text.textContent=a.controls;detail.append(summary,text);item.append(figure,heading,meta,downloads,detail);gallery.append(item)}}
const dialog=document.getElementById('viewer'),large=document.getElementById('large');function open(a){document.getElementById('viewer-title').textContent=a.title;large.src=a.png;large.alt=a.title;large.classList.remove('full');document.getElementById('zoom').textContent='原尺寸';document.getElementById('original').href=a.png;dialog.showModal()}document.getElementById('close').onclick=()=>dialog.close();document.getElementById('zoom').onclick=function(){large.classList.toggle('full');this.textContent=large.classList.contains('full')?'适应窗口':'原尺寸'};dialog.onclick=e=>{if(e.target===dialog)dialog.close()};document.getElementById('refresh').onclick=load;load();
</script></body></html>
