<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>声迹 · 独立插画资产</title><style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#244451;background:#fff}*{box-sizing:border-box}body{margin:0}main{max-width:1200px;margin:auto;padding:40px 24px}h1{font-size:30px;font-weight:600;margin:0 0 12px}header p{color:#607b88;font-size:14px;line-height:1.8}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}a,button{font:inherit;color:#147eaa;cursor:pointer}button,.bundle{border:1px solid #91cbe4;background:#f3fbff;border-radius:999px;padding:10px 18px;text-decoration:none}h2{font-size:20px;margin-top:40px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}.item{min-width:0}.art{aspect-ratio:1;background-color:#fafcfd;background-image:linear-gradient(45deg,#eef3f5 25%,transparent 25%),linear-gradient(-45deg,#eef3f5 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eef3f5 75%),linear-gradient(-45deg,transparent 75%,#eef3f5 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;border-radius:8px;display:grid;place-items:center}.art img{width:100%;height:100%;object-fit:contain}.item h3{font-size:14px;font-weight:500;margin:12px 0 6px}.item small{font-size:10px;color:#607b88;overflow-wrap:anywhere}.downloads{display:flex;gap:12px;font-size:12px;margin-top:10px}.pending{color:#607b88;font-size:12px}#status{font-size:13px;color:#607b88}@media(max-width:700px){main{padding:24px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 16px}h1{font-size:24px}}
</style></head><body><main><header><h1>声迹 · 手绘插画资产</h1><p>26 张分别生成的独立插画。透明背景，512 × 512 PNG / WebP；保留原始高清 PNG。棋盘格仅用于预览透明度。</p><div class="actions"><button id="refresh">刷新资产</button><a class="bundle" href="soundtrace-diary-assets-v1.zip" download>下载全部资产</a><a href="prompts.json" download>提示词清单</a></div><p id="status" role="status">正在读取…</p></header><div id="gallery"></div></main><script>
const plan=[{"id":"mood-calm","title":"平静"},{"id":"mood-happy","title":"开心"},{"id":"mood-excited","title":"兴奋"},{"id":"mood-missing","title":"思念"},{"id":"mood-sad","title":"低落"},{"id":"mood-tired","title":"疲惫"},{"id":"mood-hopeful","title":"期待"},{"id":"mood-nostalgic","title":"怀念"},{"id":"weather-sunny","title":"晴天"},{"id":"weather-cloudy","title":"多云"},{"id":"weather-rainy","title":"下雨"},{"id":"weather-snowy","title":"下雪"},{"id":"weather-foggy","title":"有雾"},{"id":"weather-windy","title":"有风"},{"id":"weather-night","title":"夜晚"},{"id":"activity-work","title":"工作"},{"id":"activity-study","title":"学习"},{"id":"activity-walk","title":"散步"},{"id":"activity-hike","title":"徒步"},{"id":"activity-date","title":"约会"},{"id":"activity-travel","title":"旅行"},{"id":"activity-commute","title":"通勤"},{"id":"activity-home","title":"独处"},{"id":"activity-exercise","title":"运动"},{"id":"activity-gathering","title":"聚会"},{"id":"other","title":"其他"}];
async function render(){let data={assets:[]};try{const response=await fetch('manifest.json',{cache:'no-store'});if(response.ok)data=await response.json();}catch{}const ready=new Set(data.assets.map(x=>x.id));document.getElementById('status').textContent='已完成 '+ready.size+' / 26';const gallery=document.getElementById('gallery');gallery.replaceChildren();for(const [prefix,label] of [['mood','心情 · 8 张'],['weather','天气 · 7 张'],['activity','状态 · 10 张'],['other','通用 · 1 张']]){const heading=document.createElement('h2');heading.textContent=label;const grid=document.createElement('div');grid.className='grid';for(const asset of plan.filter(x=>x.id.startsWith(prefix))){const item=document.createElement('article');item.className='item';const art=document.createElement('div');art.className='art';if(ready.has(asset.id)){const img=document.createElement('img');img.src=asset.id+'.webp';img.alt=asset.title;art.append(img);}else{const pending=document.createElement('span');pending.className='pending';pending.textContent='尚未导出';art.append(pending);}const title=document.createElement('h3');title.textContent=asset.title;const filename=document.createElement('small');filename.textContent=asset.id;item.append(art,title,filename);if(ready.has(asset.id)){const links=document.createElement('div');links.className='downloads';for(const [extension,text] of [['.png','PNG'],['.webp','WebP'],['-master.png','高清原图']]){const a=document.createElement('a');a.href=asset.id+extension;a.download='';a.textContent=text;links.append(a);}item.append(links);}grid.append(item);}gallery.append(heading,grid);}}document.getElementById('refresh').onclick=render;render();
</script></body></html>
